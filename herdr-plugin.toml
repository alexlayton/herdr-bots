id = "alexlayton.bots"
name = "Bots"
version = "0.1.0"
min_herdr_version = "0.9.2"
description = "Let agents find each other, message each other and delegate tasks"
platforms = ["macos", "linux"]

# `herdr plugin install` runs this. For a linked checkout, run `bun run build` yourself.
[[build]]
command = ["bun", "build", "src/cli.ts", "--compile", "--outfile", "bin/bots"]

# The daemon is long-lived, so it runs in a plugin pane. A startup hook only starts it.
[[panes]]
id = "daemon"
title = "Bots daemon"
placement = "tab"
command = ["sh", "-c", "if [ -x bin/bots ]; then exec bin/bots daemon; else PATH=\"$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH\" exec bun src/cli.ts daemon; fi"]

# Startup also refreshes the `bots` link made by the link-cli action, so plugin updates keep it valid.
[[startup]]
command = ["sh", "-c", "[ -L \"$HOME/.local/bin/bots\" ] && ln -sf \"$HERDR_PLUGIN_ROOT/bin/bots\" \"$HOME/.local/bin/bots\"; \"$HERDR_BIN_PATH\" plugin pane open --plugin alexlayton.bots --entrypoint daemon --placement tab"]

[[actions]]
id = "start-daemon"
title = "Start bots daemon"
contexts = ["workspace"]
command = ["sh", "-c", "\"$HERDR_BIN_PATH\" plugin pane open --plugin alexlayton.bots --entrypoint daemon --placement tab"]

[[actions]]
id = "link-cli"
title = "Put bots on PATH (~/.local/bin)"
contexts = ["workspace"]
command = ["sh", "-c", "mkdir -p \"$HOME/.local/bin\" && ln -sf \"$HERDR_PLUGIN_ROOT/bin/bots\" \"$HOME/.local/bin/bots\" && echo linked ~/.local/bin/bots"]
